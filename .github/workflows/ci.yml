name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 1. Secrets Scanning
      - name: Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 2. Build JAR
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. SonarQube Code Quality Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      # 3. Docker Login
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. Build Docker Image
      - name: Build Docker Image
        run: docker build -t nagendra06/bankapp:${{ github.sha }} .

      # 5. Trivy Security Scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nagendra06/bankapp:${{ github.sha }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      # 6. Push Docker Image
      - name: Push Docker Image
        run: docker push nagendra06/bankapp:${{ github.sha }}

      # 7. Update Kubernetes manifest
      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: nagendra06/bankapp:.*|image: nagendra06/bankapp:${{ github.sha }}|" k8s/deployment.yaml

      # 8. Commit changes
      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push

      # 9. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull nagendra06/bankapp:${{ github.sha }}
            docker stop bankapp || true
            docker rm bankapp || true
            docker run -d \
              --name bankapp \
              --restart always \
              -p 8081:8081 \
              -e SPRING_DATA_MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              nagendra06/bankapp:${{ github.sha }}
            docker image prune -f
