apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankapp
  template:
    metadata:
      labels:
        app: bankapp
    spec:
      containers:
      - name: bankapp
        image: nagendra06/bankapp:4b6a1014c5339e9a0f4cd8a09fb44ba15d59cd63
        ports:
        - containerPort: 8081