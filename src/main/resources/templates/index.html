<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
        }

        .dashboard-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 16px;
        }

        .header-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(102,126,234,0.5);
        }

        .header-title { color: #fff; font-weight: 700; font-size: 1.8rem; margin: 0; }
        .header-sub { color: rgba(255,255,255,0.55); font-size: 0.85rem; }

        .balance-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(102,126,234,0.4);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute; top: -40px; right: -40px;
            width: 160px; height: 160px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .balance-label { color: rgba(255,255,255,0.75); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }
        .balance-amount { color: #fff; font-size: 3rem; font-weight: 700; line-height: 1.1; }
        .balance-amount span { font-size: 1.8rem; }

        .action-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); }

        .action-title { font-weight: 600; font-size: 1rem; margin-bottom: 14px; }
        .deposit-title { color: #4ade80; }
        .withdraw-title { color: #f87171; }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.35);
            color: #fff;
            box-shadow: none;
        }

        .btn-deposit {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none; color: #fff; border-radius: 10px;
            padding: 10px; font-weight: 600;
            box-shadow: 0 4px 14px rgba(34,197,94,0.4);
            transition: opacity 0.2s;
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none; color: #fff; border-radius: 10px;
            padding: 10px; font-weight: 600;
            box-shadow: 0 4px 14px rgba(239,68,68,0.4);
            transition: opacity 0.2s;
        }

        .btn-deposit:hover, .btn-withdraw:hover { opacity: 0.88; color: #fff; }

        .footer { color: rgba(255,255,255,0.3); font-size: 0.78rem; }
    </style>
</head>

<body>
<div class="dashboard-wrapper">

    <!-- Header -->
    <div class="text-center mb-4">
        <div class="header-logo">🏦</div>
        <h2 class="header-title">Bank Dashboard</h2>
        <p class="header-sub">Manage your account securely</p>
    </div>
    

    <div th:if="${message}" class="alert alert-success text-center">
    <span th:text="${message}"></span>
    </div> 

    <div th:if="${error}" class="alert alert-danger text-center">
    <span th:text="${error}"></span>
    </div>


    <!-- Balance Card -->
    <div class="balance-card mb-4">
        <p class="balance-label">Current Balance</p>
        <div class="balance-amount">₹ <span th:text="${balance}"></span></div>
        <small style="color:rgba(255,255,255,0.6); font-size:0.78rem;">Available funds</small>
    </div>

    <!-- Actions -->
    <div class="row g-3">

        <!-- Deposit -->
        <div class="col-md-6">
            <div class="action-card">
                <p class="action-title deposit-title"><i class="bi bi-arrow-down-circle-fill me-2"></i>Deposit Money</p>
                <form action="/deposit" method="post">
                    <input type="number" name="amount" class="form-control mb-3" placeholder="Enter amount" required>
                    <button class="btn btn-deposit w-100">Deposit</button>
                </form>
            </div>
        </div>

        <!-- Withdraw -->
        <div class="col-md-6">
            <div class="action-card">
                <p class="action-title withdraw-title"><i class="bi bi-arrow-up-circle-fill me-2"></i>Withdraw Money</p>
                <form action="/withdraw" method="post">
                    <input type="number" name="amount" class="form-control mb-3" placeholder="Enter amount" required>
                    <button class="btn btn-withdraw w-100">Withdraw</button>
                </form>
            </div>
        </div>

    </div>



    <!-- Transaction History -->
<div class="action-card mt-4">
    <h5 class="text-white mb-3">
        <i class="bi bi-clock-history me-2"></i>
        Transaction History
    </h5>

    <ul class="list-group">

        <li class="list-group-item bg-dark text-white border-secondary"
            th:each="txn : ${transactions}"
            th:text="${txn}">
        </li>

    </ul>
</div>

    <!-- Footer -->
    <div class="text-center mt-4 footer">
        <small>© 2026 BankApp | Secure Transactions 🔒</small>
    </div>

</div>
</body>
</html>
