<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">🏦 Bank Dashboard</h2>

    <div class="card text-center p-4 shadow">
        <h4>Current Balance</h4>
        <h1 class="text-success">₹ <span th:text="${balance}"></span></h1>
    </div>

    <div class="mt-4 text-center">
        <form action="/deposit" method="post" class="d-inline">
            <input type="number" name="amount" placeholder="Amount" required>
            <button class="btn btn-success">Deposit</button>
        </form>

        <form action="/withdraw" method="post" class="d-inline">
            <input type="number" name="amount" placeholder="Amount" required>
            <button class="btn btn-danger">Withdraw</button>
        </form>
    </div>

</div>

</body>
</html>
