<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Header -->
    <div class="text-center mb-4">
        <h2>🏦 Bank Dashboar</h2>
        <p class="text-muted">Manage your account securely</p>
    </div>

    <!-- Balance Card -->
    <div class="card shadow-lg border-0 text-center p-4 mb-4">
        <h5 class="text-muted">Current Balance</h5>
        <h1 class="text-success fw-bold">
            ₹ <span th:text="${balance}"></span>
        </h1>
    </div>

    <!-- Actions -->
    <div class="row">

        <!-- Deposit -->
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm p-3">
                <h5 class="text-success">Deposit Money</h5>
                <form action="/deposit" method="post">
                    <input type="number" name="amount" class="form-control mb-2" placeholder="Enter amount" required>
                    <button class="btn btn-success w-100">Deposit</button>
                </form>
            </div>
        </div>

        <!-- Withdraw -->
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm p-3">
                <h5 class="text-danger">Withdraw Money</h5>
                <form action="/withdraw" method="post">
                    <input type="number" name="amount" class="form-control mb-2" placeholder="Enter amount" required>
                    <button class="btn btn-danger w-100">Withdraw</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="text-center mt-4 text-muted">
        <small>© 2026 BankApp | Secure Transactions</small>
    </div>

</div>

</body>
</html>
