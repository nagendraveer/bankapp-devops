<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - BankApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 40px 36px; width: 100%; max-width: 460px; }
        .brand-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px; }
        h4 { color: #fff; font-weight: 700; }
        .sub { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        label { color: rgba(255,255,255,0.7); font-size: 0.85rem; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 12px; padding: 12px 14px; }
        .form-control::placeholder { color: rgba(255,255,255,0.35); }
        .form-control:focus { background: rgba(255,255,255,0.12); border-color: rgba(102,126,234,0.6); color: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn-register { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; border-radius: 12px; padding: 13px; font-weight: 600; width: 100%; font-size: 0.95rem; }
        .btn-register:hover { opacity: 0.9; color: #fff; }
        .link { color: #a78bfa; text-decoration: none; font-size: 0.85rem; }
        .link:hover { color: #c4b5fd; }
        .alert-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 10px; font-size: 0.85rem; }
        .invalid-feedback { color: #fca5a5; font-size: 0.78rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center mb-4">
        <div class="brand-icon">🏦</div>
        <h4>Create Account</h4>
        <p class="sub">Join BankApp — get ₹1000 welcome bonus!</p>
    </div>

    <div th:if="${error}" class="alert alert-danger mb-3"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span></div>

    <form th:action="@{/register}" method="post" th:object="${registerDTO}">
        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" th:field="*{fullName}" class="form-control mt-1" placeholder="John Doe" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label>Email Address</label>
            <input type="email" th:field="*{email}" class="form-control mt-1" placeholder="you@example.com" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label>Phone Number</label>
            <input type="text" th:field="*{phone}" class="form-control mt-1" placeholder="+91 9876543210" required>
        </div>
        <div class="mb-4">
            <label>Password</label>
            <input type="password" th:field="*{password}" class="form-control mt-1" placeholder="Min 6 characters" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn-register"><i class="bi bi-person-plus me-2"></i>Create Account</button>
    </form>

    <p class="text-center mt-4 mb-0" style="color:rgba(255,255,255,0.45); font-size:0.85rem;">
        Already have an account? <a th:href="@{/login}" class="link">Sign in</a>
    </p>
</div>
</body>
</html>
