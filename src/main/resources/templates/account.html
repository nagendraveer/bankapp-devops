<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Account - BankApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
        .topbar { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
        .brand { color: #fff; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; margin-left: 20px; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .wrapper { max-width: 600px; margin: 0 auto; padding: 36px 16px 60px; }
        .avatar-big { width: 80px; height: 80px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; }
        .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 28px; margin-bottom: 16px; }
        .card-title { color: rgba(255,255,255,0.4); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: rgba(255,255,255,0.45); font-size: 0.82rem; }
        .info-value { color: #fff; font-size: 0.88rem; font-weight: 500; }
        .badge-active { background: rgba(34,197,94,0.2); color: #4ade80; border-radius: 20px; padding: 3px 12px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand"><div class="brand-icon">🏦</div> BankApp</div>
    <div class="nav-links d-none d-md-block">
        <a th:href="@{/dashboard}"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a th:href="@{/transfer}"><i class="bi bi-arrow-left-right me-1"></i>Transfer</a>
        <a th:href="@{/history}"><i class="bi bi-clock-history me-1"></i>History</a>
        <a th:href="@{/account}" class="active"><i class="bi bi-person me-1"></i>Account</a>
    </div>
    <a th:href="@{/logout}" style="color:rgba(255,255,255,0.5); font-size:0.82rem; text-decoration:none;"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="wrapper">
    <div class="text-center mb-4">
        <div class="avatar-big">👤</div>
        <h5 style="color:#fff; font-weight:700;" th:text="${user.fullName}"></h5>
        <span class="badge-active"><i class="bi bi-check-circle me-1"></i>Active Account</span>
    </div>

    <div class="card">
        <p class="card-title"><i class="bi bi-person me-2"></i>Personal Information</p>
        <div class="info-row">
            <span class="info-label">Full Name</span>
            <span class="info-value" th:text="${user.fullName}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value" th:text="${user.email}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Phone</span>
            <span class="info-value" th:text="${user.phone}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Member Since</span>
            <span class="info-value" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"></span>
        </div>
    </div>

    <div class="card">
        <p class="card-title"><i class="bi bi-credit-card me-2"></i>Account Details</p>
        <div class="info-row">
            <span class="info-label">Account Number</span>
            <span class="info-value" th:text="${account.accountNumber}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Account Type</span>
            <span class="info-value" th:text="${account.accountType}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Current Balance</span>
            <span class="info-value" style="color:#4ade80; font-weight:700;" th:text="'₹' + ${#numbers.formatDecimal(account.balance, 1, 2)}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Account Opened</span>
            <span class="info-value" th:text="${#temporals.format(account.createdAt, 'dd MMM yyyy')}"></span>
        </div>
    </div>
</div>
</body>
</html>
