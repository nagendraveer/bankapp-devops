<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transfer - BankApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
        .topbar { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
        .brand { color: #fff; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; margin-left: 20px; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .wrapper { max-width: 520px; margin: 0 auto; padding: 40px 16px; }
        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 36px; }
        .page-title { color: #fff; font-weight: 700; font-size: 1.3rem; }
        .page-sub { color: rgba(255,255,255,0.45); font-size: 0.82rem; }
        label { color: rgba(255,255,255,0.7); font-size: 0.85rem; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 12px; padding: 12px 14px; }
        .form-control::placeholder { color: rgba(255,255,255,0.35); }
        .form-control:focus { background: rgba(255,255,255,0.12); border-color: rgba(102,126,234,0.6); color: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn-transfer { background: linear-gradient(135deg, #facc15, #f59e0b); border: none; color: #1a1a1a; border-radius: 12px; padding: 13px; font-weight: 700; width: 100%; font-size: 0.95rem; box-shadow: 0 4px 16px rgba(250,204,21,0.3); }
        .btn-transfer:hover { opacity: 0.9; }
        .alert-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; border-radius: 10px; font-size: 0.85rem; }
        .alert-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 10px; font-size: 0.85rem; }
        .back-link { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand"><div class="brand-icon">🏦</div> BankApp</div>
    <div class="nav-links d-none d-md-block">
        <a th:href="@{/dashboard}"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a th:href="@{/transfer}" class="active"><i class="bi bi-arrow-left-right me-1"></i>Transfer</a>
        <a th:href="@{/history}"><i class="bi bi-clock-history me-1"></i>History</a>
        <a th:href="@{/account}"><i class="bi bi-person me-1"></i>Account</a>
    </div>
    <a th:href="@{/logout}" style="color:rgba(255,255,255,0.5); font-size:0.82rem; text-decoration:none;"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="wrapper">
    <div th:if="${success}" class="alert alert-success mb-3"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-danger mb-3"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span></div>

    <div class="card">
        <div class="mb-4">
            <p class="page-title"><i class="bi bi-arrow-left-right me-2"></i>Transfer Money</p>
            <p class="page-sub">Send money to any BankApp account instantly</p>
        </div>

        <form th:action="@{/transfer}" method="post" th:object="${transferDTO}">
            <div class="mb-3">
                <label>Recipient Account Number</label>
                <input type="text" th:field="*{toAccountNumber}" class="form-control mt-1" placeholder="e.g. ACC1A2B3C4D5" required>
            </div>
            <div class="mb-3">
                <label>Amount (₹)</label>
                <input type="number" th:field="*{amount}" class="form-control mt-1" placeholder="Enter amount" min="1" step="0.01" required>
            </div>
            <div class="mb-4">
                <label>Description (optional)</label>
                <input type="text" th:field="*{description}" class="form-control mt-1" placeholder="e.g. Rent, Groceries...">
            </div>
            <button type="submit" class="btn-transfer"><i class="bi bi-send me-2"></i>Send Money</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/dashboard}" class="back-link"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
