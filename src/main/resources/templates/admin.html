<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BankApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f0c29; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .topbar { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.3rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .wrapper { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .stat-card { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 12px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #fff; }
        .stat-label { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        .section-title { color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
        .table-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; }
        .table { color: #fff; margin: 0; }
        .table thead th { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); font-size: 0.78rem; text-transform: uppercase; }
        .table td { border-color: rgba(255,255,255,0.06); font-size: 0.85rem; vertical-align: middle; }
        .badge-admin { background: rgba(239,68,68,0.2); color: #f87171; border-radius: 6px; padding: 3px 8px; font-size: 0.72rem; }
        .badge-user { background: rgba(102,126,234,0.2); color: #818cf8; border-radius: 6px; padding: 3px 8px; font-size: 0.72rem; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand"><div>🏦</div> BankApp Admin</div>
    <a th:href="@{/logout}" style="color:rgba(255,255,255,0.5); text-decoration:none; font-size:0.85rem;"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
</div>

<div class="wrapper">

    <!-- Stats -->
    <p class="section-title">Overview</p>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(102,126,234,0.2); color:#818cf8;"><i class="bi bi-people-fill"></i></div>
                <div class="stat-value" th:text="${totalUsers}">0</div>
                <div class="stat-label">Total Users</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(34,197,94,0.2); color:#4ade80;"><i class="bi bi-credit-card-fill"></i></div>
                <div class="stat-value" th:text="${totalAccounts}">0</div>
                <div class="stat-label">Total Accounts</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(250,204,21,0.2); color:#facc15;"><i class="bi bi-arrow-left-right"></i></div>
                <div class="stat-value" th:text="${totalTransactions}">0</div>
                <div class="stat-label">Total Transactions</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:rgba(239,68,68,0.2); color:#f87171;"><i class="bi bi-currency-rupee"></i></div>
                <div class="stat-value">₹<span th:text="${#numbers.formatDecimal(totalBalance, 1, 2)}">0</span></div>
                <div class="stat-label">Total Balance</div>
            </div>
        </div>
    </div>

    <!-- Users Table -->
    <p class="section-title">All Users</p>
    <div class="table-card mb-4">
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Joined</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.phone}"></td>
                    <td>
                        <span th:if="${user.role == 'ROLE_ADMIN'}" class="badge-admin">ADMIN</span>
                        <span th:if="${user.role == 'ROLE_USER'}" class="badge-user">USER</span>
                    </td>
                    <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Accounts Table -->
    <p class="section-title">All Accounts</p>
    <div class="table-card">
        <table class="table">
            <thead>
                <tr>
                    <th>Account Number</th>
                    <th>Type</th>
                    <th>Balance</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="account : ${accounts}">
                    <td th:text="${account.accountNumber}"></td>
                    <td th:text="${account.accountType}"></td>
                    <td>₹<span th:text="${#numbers.formatDecimal(account.balance, 1, 2)}"></span></td>
                    <td th:text="${#temporals.format(account.createdAt, 'dd MMM yyyy')}"></td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
