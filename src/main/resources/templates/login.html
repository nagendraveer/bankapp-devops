<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - BankApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 40px 36px; width: 100%; max-width: 420px; }
        .brand-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px; }
        h4 { color: #fff; font-weight: 700; }
        .sub { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        label { color: rgba(255,255,255,0.7); font-size: 0.85rem; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 12px; padding: 12px 14px; }
        .form-control::placeholder { color: rgba(255,255,255,0.35); }
        .form-control:focus { background: rgba(255,255,255,0.12); border-color: rgba(102,126,234,0.6); color: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn-login { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; border-radius: 12px; padding: 13px; font-weight: 600; width: 100%; font-size: 0.95rem; }
        .btn-login:hover { opacity: 0.9; color: #fff; }
        .link { color: #a78bfa; text-decoration: none; font-size: 0.85rem; }
        .link:hover { color: #c4b5fd; }
        .alert-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 10px; font-size: 0.85rem; }
        .alert-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; border-radius: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center mb-4">
        <div class="brand-icon">🏦</div>
        <h4>Welcome Back</h4>
        <p class="sub">Sign in to your BankApp account</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Invalid email or password.</div>
    <div th:if="${param.logout}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Logged out successfully.</div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label>Email Address</label>
            <input type="email" name="username" class="form-control mt-1" placeholder="you@example.com" required>
        </div>
        <div class="mb-4">
            <label>Password</label>
            <input type="password" name="password" class="form-control mt-1" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
    </form>

    <p class="text-center mt-4 mb-0" style="color:rgba(255,255,255,0.45); font-size:0.85rem;">
        Don't have an account? <a th:href="@{/register}" class="link">Create one</a>
    </p>
</div>
</body>
</html>
