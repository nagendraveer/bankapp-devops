<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>History - BankApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
        .topbar { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
        .brand { color: #fff; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; margin-left: 20px; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .wrapper { max-width: 760px; margin: 0 auto; padding: 36px 16px 60px; }
        .page-title { color: #fff; font-weight: 700; font-size: 1.3rem; }
        .page-sub { color: rgba(255,255,255,0.45); font-size: 0.82rem; }
        .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 8px 0; }
        .tx-item { display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s; }
        .tx-item:last-child { border-bottom: none; }
        .tx-item:hover { background: rgba(255,255,255,0.03); }
        .tx-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
        .tx-desc { color: #fff; font-size: 0.88rem; font-weight: 500; }
        .tx-date { color: rgba(255,255,255,0.35); font-size: 0.72rem; }
        .tx-amount { font-weight: 700; font-size: 0.92rem; margin-left: auto; white-space: nowrap; }
        .tx-balance { color: rgba(255,255,255,0.35); font-size: 0.72rem; text-align: right; }
        .badge-type { font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
        .empty { color: rgba(255,255,255,0.3); text-align: center; padding: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand"><div class="brand-icon">🏦</div> BankApp</div>
    <div class="nav-links d-none d-md-block">
        <a th:href="@{/dashboard}"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a th:href="@{/transfer}"><i class="bi bi-arrow-left-right me-1"></i>Transfer</a>
        <a th:href="@{/history}" class="active"><i class="bi bi-clock-history me-1"></i>History</a>
        <a th:href="@{/account}"><i class="bi bi-person me-1"></i>Account</a>
    </div>
    <a th:href="@{/logout}" style="color:rgba(255,255,255,0.5); font-size:0.82rem; text-decoration:none;"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="wrapper">
    <div class="mb-4">
        <p class="page-title"><i class="bi bi-clock-history me-2"></i>Transaction History</p>
        <p class="page-sub" th:text="'Account: ' + ${account.accountNumber}"></p>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(transactions)}" class="empty">
            <i class="bi bi-inbox" style="font-size:2rem; display:block; margin-bottom:10px;"></i>
            No transactions found
        </div>
        <div th:each="tx : ${transactions}" class="tx-item">
            <div class="tx-icon"
                 th:style="${tx.type == 'DEPOSIT'} ? 'background:rgba(74,222,128,0.15); color:#4ade80;' :
                            (${tx.type == 'WITHDRAW'} ? 'background:rgba(248,113,113,0.15); color:#f87171;' :
                            (${tx.type == 'TRANSFER_IN'} ? 'background:rgba(96,165,250,0.15); color:#60a5fa;' : 'background:rgba(250,204,21,0.15); color:#facc15;'))">
                <i th:class="${tx.type == 'DEPOSIT'} ? 'bi bi-arrow-down' :
                              (${tx.type == 'WITHDRAW'} ? 'bi bi-arrow-up' :
                              (${tx.type == 'TRANSFER_IN'} ? 'bi bi-arrow-down-left' : 'bi bi-arrow-up-right'))"></i>
            </div>
            <div style="flex:1; min-width:0;">
                <div class="tx-desc" th:text="${tx.description}"></div>
                <div class="tx-date" th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy, hh:mm a')}"></div>
            </div>
            <div class="text-end">
                <div class="tx-amount"
                     th:style="${tx.type == 'DEPOSIT' or tx.type == 'TRANSFER_IN'} ? 'color:#4ade80;' : 'color:#f87171;'"
                     th:text="${(tx.type == 'DEPOSIT' or tx.type == 'TRANSFER_IN') ? '+' : '-'} + '₹' + ${#numbers.formatDecimal(tx.amount, 1, 2)}">
                </div>
                <div class="tx-balance" th:text="'Bal: ₹' + ${#numbers.formatDecimal(tx.balanceAfter, 1, 2)}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
